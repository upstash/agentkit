# uv workspace for the Python packages under python/*. It lives beside the pnpm workspace rather than
# replacing anything: each Python package also carries a private package.json so Changesets versions
# it like every other package (see the "Python packages" section of CLAUDE.md).
[tool.uv.workspace]
members = ["python/*"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

# A Hermes directory plugin's entry point is `__init__.py` at the plugin root, and the root is a
# hyphenated `python/<name>` folder.
[tool.ruff.lint.per-file-ignores]
"python/*/__init__.py" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["python"]
# The plugin-root `__init__.py` makes `python/<name>` look like a package to the default
# `prepend` mode, which then fails to import it; importlib mode imports test files on their own.
addopts = ["--import-mode=importlib"]
