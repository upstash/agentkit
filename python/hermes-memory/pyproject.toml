[project]
name = "upstash-hermes-memory"
version = "0.1.0"
description = "Upstash Redis memory provider for Hermes Agent: long-term memory, searchable chat history and recall on Redis Search, with no separate vector database."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Upper bound: the Hermes plugin catalog asks for one on every dependency (catalog rule 10).
dependencies = ["upstash-redis>=1.8.0,<2"]

# Hermes discovers pip-installed memory providers through this group; the entry-point name is the
# value of `memory.provider` in Hermes's config.yaml.
[project.entry-points."hermes_agent.memory_providers"]
upstash = "upstash_hermes_memory:register"

[project.urls]
Homepage = "https://github.com/upstash/agentkit"
Repository = "https://github.com/upstash/agentkit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
